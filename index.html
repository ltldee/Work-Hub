<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work</title>
<meta name="theme-color" content="#2B2D31">
<link id="fav" rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ctext%20x%3D%2232%22%20y%3D%2251%22%20text-anchor%3D%22middle%22%20font-family%3D%22Georgia%2C%27Times%20New%20Roman%27%2Cserif%22%20font-size%3D%2262%22%20fill%3D%22%23FFFFFF%22%3ED%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------
   Every colour lives here as a custom property. Nothing else in
   this stylesheet hard-codes a colour, so the customizer can
   change one variable and the whole page follows.
   --------------------------------------------------------------- */
:root{
  --sidebar:#2B2D31;
  --page-bg:#EFEEF2;
  --card-bg:#FFFFFF;
  --accent:#5B5E8C;

  /* worked out from the four above by JS, never set by hand */
  --sidebar-text:#F2F1F4;
  --sidebar-dim:#9B9AA3;
  --sidebar-line:#3C3E44;
  --page-text:#26262B;
  --card-text:#26262B;
  --muted:#6E6D78;
  --line:#E1E0E6;
  --line-soft:#EDECF1;
  --accent-text:#FFFFFF;
  --tint:#F6F5F9;

  --ok:#4E7D5E;
  --warn:#9A6B2F;
  --late:#9B4A45;

  --r-sm:7px;
  --r-md:11px;
  --r-lg:16px;
  --shadow-pop:0 10px 34px -12px rgba(20,20,30,.34), 0 2px 6px -2px rgba(20,20,30,.14);
  --scrim:rgba(22,22,28,.42);
  --shadow-seg:0 1px 2px rgba(0,0,0,.08);
  --sans:"Karla","Segoe UI",Helvetica,Arial,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --rail:238px;

  --s1:6px;
  --s2:10px;
  --s3:16px;
  --s4:22px;
  --s5:32px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page-bg);
  color:var(--page-text);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-wrap:break-word;word-break:break-word;
}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.2}
p{margin:0 0 .7em}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;background:none;border:0;margin:0;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:var(--card-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.hide{display:none !important}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{
  width:0;flex:0 0 auto;overflow:hidden;white-space:nowrap;
  background:var(--sidebar);color:var(--sidebar-text);
  padding:0;
  display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;
  transition:width .22s ease;
}
.shell.nav-open .rail{width:var(--rail);overflow-y:auto;overflow-x:hidden;padding:22px 14px 16px}
.nav-scrim{display:none}
.nav-close{
  align-self:flex-end;width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;color:var(--sidebar-dim);margin-bottom:4px;
}
.nav-close:hover{background:var(--sidebar-line);color:var(--sidebar-text)}
.nav-close svg{width:16px;height:16px}
.nav-toggle{
  position:fixed;top:16px;left:16px;z-index:90;
  width:44px;height:44px;border-radius:50%;border:0;
  background:var(--sidebar);color:var(--sidebar-text);
  display:grid;place-items:center;box-shadow:var(--shadow-pop);cursor:pointer;
}
.shell.nav-open .nav-toggle{display:none}
.nav-toggle svg{width:20px;height:20px}
.home-btn{
  position:fixed;top:16px;left:68px;z-index:90;
  width:44px;height:44px;border-radius:50%;border:0;
  background:var(--sidebar);color:var(--sidebar-text);
  display:grid;place-items:center;box-shadow:var(--shadow-pop);cursor:pointer;
}
.home-btn svg{width:19px;height:19px}
.shell.nav-open .home-btn{display:none}
.rail-me{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.rail-me .avatar{width:34px;height:34px;flex:0 0 34px}
.rail-me .who{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.rail-me .sub{font-size:12px;color:var(--sidebar-dim)}
.nav-h{
  font-size:11.5px;color:var(--sidebar-dim);
  padding:16px 8px 6px;letter-spacing:.01em;
}
.nav-a{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:0;text-align:left;
  padding:8px 9px;border-radius:var(--r-sm);
  color:var(--sidebar-text);font-size:14.5px;
  transition:background .12s ease;
}
.nav-a:hover{background:var(--sidebar-line)}
.nav-a[aria-current="page"]{background:var(--sidebar-line);font-weight:600}
.nav-a .ic{width:17px;height:17px;flex:0 0 17px;opacity:.86}
.nav-a .count{margin-left:auto;font-size:12px;color:var(--sidebar-dim)}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;background:var(--a,var(--accent))}
.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--sidebar-line)}

.main{flex:1;min-width:0;width:100%;padding:76px var(--s5) 96px}
.topbar{display:none}

/* ---------- layout helpers, so spacing comes from one place ---------- */
.page-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:var(--s4)}
.page-h h1{
  font-family:var(--serif);font-weight:400;font-size:30px;
  letter-spacing:-.02em;line-height:1.1;margin-right:auto;
}
.page-h .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hstack{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hstack.top{align-items:flex-start}
.min0{min-width:0}
.grow{flex:1;min-width:180px}
.prose{font-size:13.5px;color:var(--muted);max-width:62ch;margin:0}
.note-s{font-size:13px;color:var(--muted);margin:0}
.stat{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1}
.statbar{display:flex;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s3)}
.gap-t{margin-top:var(--s4)}

/* ---------- shared pieces ---------- */
.card{background:var(--card-bg);border:1px solid var(--line);border-radius:var(--r-md)}
.pad{padding:18px 20px}
.sec{margin-bottom:var(--s5)}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:var(--s2)}
.sec-h h2{font-size:17px;letter-spacing:-.015em}
.sec-h .note{font-size:13px;color:var(--muted)}
.sec-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}

.btn{
  border:1px solid var(--line);background:var(--card-bg);color:var(--card-text);
  padding:7px 13px;border-radius:var(--r-sm);font-size:14px;font-weight:500;
  transition:border-color .12s ease, background .12s ease;
}
.btn:hover{border-color:var(--muted)}
.btn-a{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn-a:hover{filter:brightness(1.08)}
.btn-s{padding:4px 9px;font-size:13px}
.btn-q{border-color:transparent;background:transparent;color:var(--muted)}
.btn-q:hover{background:var(--tint);border-color:transparent;color:var(--card-text)}
.btn-danger{color:var(--late)}

.field{display:block;margin-bottom:13px}
.field > span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.in{
  width:100%;padding:8px 10px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--card-bg);
}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea.in{min-height:74px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

.avatar{
  border-radius:50%;object-fit:cover;background:var(--tint);
  display:grid;place-items:center;overflow:hidden;flex:none;
  color:var(--muted);
}
.avatar svg{width:56%;height:56%;opacity:.55}

.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:500;
  background:var(--tint);color:var(--muted);white-space:nowrap;
}
.pill.high{background:color-mix(in srgb,var(--late) 13%,var(--card-bg));color:var(--late)}
.pill.med{background:color-mix(in srgb,var(--warn) 14%,var(--card-bg));color:var(--warn)}
.pill.low{background:color-mix(in srgb,var(--ok) 13%,var(--card-bg));color:var(--ok)}
.pill.area{background:color-mix(in srgb,var(--a) 17%,var(--card-bg));color:color-mix(in srgb,var(--a) 62%,var(--card-text))}

.when{font-size:13.5px;color:var(--muted);white-space:nowrap}
.when.today{color:var(--warn);font-weight:600}
.when.late{color:var(--late);font-weight:600}

.tick{
  appearance:none;width:17px;height:17px;flex:none;border:1.5px solid var(--muted);
  border-radius:5px;background:var(--card-bg);cursor:pointer;position:relative;
  transition:border-color .12s ease;
}
.tick:hover{border-color:var(--accent)}
.tick:checked{background:var(--accent);border-color:var(--accent)}
.tick:checked::after{
  content:"";position:absolute;left:5px;top:1.5px;width:4px;height:9px;
  border:solid var(--accent-text);border-width:0 2px 2px 0;transform:rotate(42deg);
}

.empty{
  border:1px dashed var(--line);border-radius:var(--r-md);
  padding:26px 20px;text-align:center;color:var(--muted);font-size:14px;
}
.empty strong{display:block;color:var(--card-text);font-weight:600;margin-bottom:3px}

.more{
  width:100%;border:0;background:transparent;color:var(--muted);
  padding:9px;font-size:13.5px;text-align:left;border-top:1px solid var(--line-soft);
}
.more:hover{color:var(--card-text);background:var(--tint)}

.seg{display:inline-flex;background:var(--tint);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:5px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card-bg);color:var(--card-text);font-weight:600;box-shadow:var(--shadow-seg)}

/* ---------- home ---------- */
.cover{
  position:relative;height:var(--coverBoxHeight,clamp(130px,22vw,208px));border-radius:var(--r-lg);
  background:linear-gradient(110deg,var(--c1),var(--c2));
  overflow:hidden;
}
.cover-img{
  position:absolute;inset:0;
  background-repeat:no-repeat;
  background-size:var(--coverFit,cover);background-position:center var(--coverY,50%);
  transform:scale(var(--coverZoom,1));transform-origin:center;
}
/* "Show whole picture" often fits edge-to-edge on one side already, leaving no room
   for an up/down move — let the same slider pan sideways instead so it still does something */
.cover-img[data-fit="contain"]{background-position:var(--coverY,50%) var(--coverY,50%)}
.cover.empty{display:grid;place-items:center}
.cover.empty .hint{
  color:var(--card-text);background:color-mix(in srgb,var(--card-bg) 80%,transparent);
  padding:8px 14px;border-radius:999px;font-size:13.5px;border:1px solid var(--line);
}
.cover-acts{
  position:absolute;right:9px;bottom:9px;display:flex;align-items:center;gap:2px;
  padding:2px;border-radius:999px;
  background:color-mix(in srgb,var(--card-bg) 62%,transparent);
  backdrop-filter:blur(8px);
  transition:opacity .15s ease;
}
.cv{
  border:0;background:none;color:var(--card-text);
  font-size:11.5px;line-height:1;padding:4px 8px;border-radius:999px;
  opacity:.85;
}
.cv:hover{background:color-mix(in srgb,var(--card-text) 11%,transparent);opacity:1}
.cover-acts{opacity:.34}
.cover:focus-within .cover-acts,.cover:active .cover-acts{opacity:1}
@media (hover:hover){
  .cover:hover .cover-acts{opacity:1}
}
.cover-acts .btn{
  background:color-mix(in srgb,var(--card-bg) 86%,transparent);
  border-color:color-mix(in srgb,var(--card-text) 12%,transparent);
  backdrop-filter:blur(7px);
}

.cover-panel{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:61;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:var(--card-bg);color:var(--card-text);border:1px solid var(--line);
  border-radius:999px;padding:9px 20px;box-shadow:var(--shadow-pop);
  max-width:calc(100vw - 32px);
}
.cover-panel.hide{display:none}
.cp-seg{
  border:1px solid var(--line);background:var(--card-bg);color:var(--card-text);
  padding:6px 13px;border-radius:999px;font-size:13.5px;
}
.cp-seg.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.cp-slide{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.cp-slide input[type=range]{accent-color:var(--accent);width:110px}
@media (max-width:480px){
  .cover-panel{
    left:12px;right:12px;bottom:12px;transform:none;max-width:none;
    border-radius:var(--r-lg);justify-content:center;padding:14px 16px;
  }
}
.hero{position:relative;z-index:1;padding-left:4px;margin-top:var(--s3)}
.hero .avatar{border:4px solid var(--page-bg);box-shadow:0 2px 10px -4px var(--scrim)}
.hero{display:flex;align-items:center;gap:22px;margin-bottom:30px;flex-wrap:wrap}
.hero .avatar{width:96px;height:96px}
.hero-day{
  font-family:var(--serif);font-weight:300;
  font-size:clamp(44px,7vw,74px);line-height:.92;letter-spacing:-.025em;
  font-variation-settings:"opsz" 90,"SOFT" 30;
}
.hero-date{font-size:19px;color:var(--muted);margin-top:11px}
.wx{
  margin-left:auto;align-self:center;min-width:176px;
  background:color-mix(in srgb,var(--sidebar) 7%,var(--card-bg));
  border:1px solid var(--line);color:var(--card-text);
  border-radius:var(--r-md);padding:11px 15px;
}
.wx .t{font-size:24px;font-family:var(--serif);font-weight:400;line-height:1.1}
.wx .d{font-size:13px;color:var(--muted);margin-top:2px}
.wx .p{font-size:12.5px;color:var(--muted);margin-top:8px;border-top:1px solid var(--line-soft);padding-top:8px}
.wx button{background:var(--card-bg);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:3px 9px;font-size:12.5px;margin-top:8px}
.wx button:hover{color:var(--card-text);border-color:var(--muted)}

.due-pair{display:flex;flex-wrap:wrap;align-items:flex-start;gap:11px;margin-bottom:26px}
.due-slot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;flex:1 1 220px;min-width:0}
.due-slot .due-list{width:100%}
.due-box{
  display:inline-flex;align-items:center;gap:12px;width:auto;
  background:var(--card-bg);border:1px solid var(--line);border-radius:999px;
  padding:15px 24px;font-size:17px;
}
.due-box:hover{border-color:var(--muted)}
.due-box[aria-expanded="true"]{border-color:var(--accent)}
.due-box .n{font-weight:700;font-size:24px;line-height:1}
.due-box .l{color:var(--muted)}
.due-box .chev{width:18px;height:18px;opacity:.6;transition:transform .16s ease}
.due-box[aria-expanded="true"] .chev{transform:rotate(180deg)}
.due-list{margin-top:2px}
.due-list ul{list-style:none;margin:0;padding:0}
.due-list li{display:flex;align-items:center;gap:11px;padding:9px 18px;border-top:1px solid var(--line-soft)}
.due-list li:first-child{border-top:0}
.due-list .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.home-two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);align-items:stretch}
.home-two > .sec{display:flex;flex-direction:column}
.home-two > .sec > .card{flex:1}
.home-two > .sec{margin-bottom:0}
@media (max-width:900px){ .home-two{grid-template-columns:1fr;gap:var(--s5)} }
.todo li{display:flex;align-items:center;gap:11px;padding:10px 20px;border-top:1px solid var(--line-soft)}
.todo li.jdone .nm{text-decoration:line-through;color:var(--muted)}
.todo .x{padding:2px 7px;line-height:1;font-size:15px}
.reorder.j{border:0;padding:0;margin:0;gap:2px;opacity:0;transition:opacity .12s ease}
.todo li:hover .reorder.j,.reorder.j:focus-within{opacity:1}
.reorder.j .mv{width:22px;height:22px;font-size:11px}
.todo li:first-child{border-top:0}
.todo ul{list-style:none;margin:0;padding:0}
.todo .nm{flex:1;min-width:0}
.todo input.tick{margin:0}
.add-row{display:flex;gap:8px;padding:11px 20px;border-top:1px solid var(--line-soft);background:var(--tint);border-radius:0 0 var(--r-md) var(--r-md)}
.add-row .in{background:var(--card-bg)}
.add-row .qd{width:auto;flex:none}
.add-row .qa{width:auto;flex:none;max-width:190px}
.add-row > .in:first-child{flex:1;min-width:120px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:14px}
.tile{
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;
  background:var(--card-bg);text-align:left;padding:0;display:block;width:100%;
  -webkit-mask-image:-webkit-radial-gradient(white,black); /* forces Safari to actually clip a <button>'s corners */
}
.tile:hover{border-color:var(--a)}
.tile .cover{
  display:block;height:74px;position:relative;overflow:hidden;
  background:color-mix(in srgb,var(--a) 30%,var(--card-bg));
  border-radius:calc(var(--r-md) - 1px) calc(var(--r-md) - 1px) 0 0;
}
.tile .cover img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.tile .body{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:12px 15px;min-height:62px}
.tile .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;line-height:1.25}
.tile .ct{display:block;font-size:13px;color:var(--muted);line-height:1.3}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-title{font-family:var(--serif);font-weight:400;font-size:25px;letter-spacing:-.02em;min-width:210px}
.linkbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-bottom:var(--s2);padding:7px 12px;border-radius:999px;font-size:13px;
  background:var(--tint);color:var(--muted);
}
.linkbar.bad{background:color-mix(in srgb,var(--warn) 12%,var(--card-bg));color:var(--warn)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));width:100%}
.grid7 .dow{min-width:0;overflow:hidden;padding:7px 9px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.cell{
  min-width:0;min-height:104px;overflow:hidden;
  border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  padding:6px 7px;background:var(--card-bg);
}
.cell:nth-child(7n){border-right:0}
.cell.off{background:var(--tint)}
.cell .num{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.cell.is-today .num{
  background:var(--accent);color:var(--accent-text);font-weight:600;
  width:21px;height:21px;border-radius:50%;display:grid;place-items:center;
}
.chip{
  display:block;width:100%;min-width:0;max-width:100%;text-align:left;border:0;border-radius:5px;
  padding:3px 6px;margin-top:4px;font-size:12.5px;
  background:color-mix(in srgb,var(--a) 20%,var(--card-bg));
  color:color-mix(in srgb,var(--a) 66%,var(--card-text));
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border-left:3px solid var(--a);
}
.chip.done{opacity:.5;text-decoration:line-through}
.day-col{border-top:1px solid var(--line);padding:12px 0}
.hourly{display:grid;grid-template-columns:64px minmax(0,1fr)}
.hourly .h{font-size:12.5px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line-soft)}
.hourly .slot{min-width:0;border-top:1px solid var(--line-soft);padding:6px 8px;min-height:40px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wk .d{min-width:0;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card-bg);padding:9px;min-height:150px}
.wk .d.is-today{border-color:var(--accent)}
.wk .d h4{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:5px}
.wk .d.is-today h4{color:var(--accent);font-weight:700}

/* ---------- files ---------- */
.cat{margin-bottom:var(--s3);overflow:hidden}
.cat-h{display:flex;align-items:center;gap:11px;padding:13px 18px;border-bottom:1px solid var(--line-soft)}
.cat-h{align-items:center}
.cat-h .ico{
  width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:transparent;font-size:21px;overflow:hidden;
}
.cat-h h3{font-size:16px;letter-spacing:-.01em}

/* the tiles */
.fgrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));
  gap:6px;padding:14px 12px 16px;
}
.fgrid.bare{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.fgrid.bare .tf-nm{display:none}
.tile-f{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:12px 7px 11px;border-radius:var(--r-md);border:1px solid var(--line);
  text-align:center;cursor:pointer;transition:background .12s ease,border-color .12s ease;
}
.tile-f:hover{background:var(--tint);border-color:var(--muted)}
.tile-f.flat{cursor:default;border-color:transparent}
.tile-f.flat:hover{background:transparent;border-color:transparent}
.tf-ico{
  width:64px;height:64px;flex:none;border-radius:16px;display:grid;place-items:center;
  overflow:hidden;font-size:29px;line-height:1;
  background:color-mix(in srgb,var(--a) 17%,var(--card-bg));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--card-text) 6%,transparent);
}
.tf-ico img{width:100%;height:100%;object-fit:cover;display:block}
.tf-ico.fav{background:var(--card-bg)}
.tf-ico.fav img,.tf-ico.own img{object-fit:contain;padding:7px;background:var(--card-bg);image-rendering:auto}
.tf-ico .ext{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.tf-nm{
  font-size:12.5px;line-height:1.3;color:var(--card-text);word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.tf-edit{
  position:absolute;top:3px;right:3px;width:22px;height:22px;padding:0;
  border:0;border-radius:50%;background:var(--card-bg);color:var(--muted);
  font-size:13px;line-height:1;opacity:0;transition:opacity .12s ease;
  box-shadow:0 1px 4px -1px var(--scrim);
}
.tile-f:hover .tf-edit,.tf-edit:focus{opacity:1}
.tf-add .tf-ico{
  background:transparent;box-shadow:none;color:var(--muted);font-size:24px;
  border:1px dashed color-mix(in srgb,var(--card-text) 22%,transparent);
}
.tf-add .tf-nm{color:var(--muted)}
.tf-add:hover .tf-ico{border-color:var(--accent);color:var(--accent)}
.cat.over{border-color:var(--accent);background:var(--tint)}
.addchoice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.addchoice button{
  display:flex;flex-direction:column;align-items:center;gap:9px;padding:20px 12px;
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--card-bg);
}
.addchoice button:hover{border-color:var(--accent)}
.addchoice .g{font-size:27px;line-height:1}
.addchoice .t{font-weight:600}
.addchoice .s{font-size:12.5px;color:var(--muted);line-height:1.35}
.cat-h .ico img{width:100%;height:100%;object-fit:cover}
.cat-h h3{font-size:15.5px}
.cat-h .sub{font-size:13px;color:var(--muted)}
.cat-h .acts{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.reorder{display:flex;align-items:center;gap:4px;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
.btn[disabled]{opacity:.35;cursor:default}
.btn[disabled]:hover{border-color:var(--line)}
.f-row{display:flex;align-items:center;gap:11px;padding:9px 18px;border-top:1px solid var(--line-soft)}
.cat-h + .f-row{border-top:0}
.f-ic{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;flex:none;background:var(--tint);font-size:11px;font-weight:700;color:var(--muted)}
.f-ic img{width:16px;height:16px}
.f-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-row .nm a{color:var(--card-text);text-decoration:none}
.f-row .nm a:hover{text-decoration:underline}
.f-row.top{align-items:flex-start}
.f-row .sz{font-size:12.5px;color:var(--muted)}
.drop{border:1px dashed var(--line);border-radius:var(--r-sm);padding:14px;text-align:center;color:var(--muted);font-size:13.5px;margin:10px 18px 14px}
.drop.over{border-color:var(--accent);background:var(--tint);color:var(--card-text)}

/* ---------- events ---------- */
.ev{border-left:3px solid var(--a);margin-bottom:var(--s2)}
.ev h3{font-size:17px}
.ev .when{display:block;margin-top:3px}
.ev .blurb{font-size:13.5px;color:var(--muted);margin:8px 0 0}
.ev-count{text-align:right;min-width:74px}
.ev .tags{margin-top:11px}

.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s3)}
.evc{
  display:flex;flex-direction:column;gap:var(--s2);padding:15px 16px;cursor:pointer;
  border-top:3px solid var(--a);transition:border-color .12s ease, box-shadow .12s ease;
}
.evc:hover{box-shadow:0 6px 18px -12px var(--scrim)}
.evc-top{display:flex;gap:13px;align-items:flex-start}
.evc-top h3{font-size:16px;line-height:1.25;margin-bottom:3px}
.evc-date{
  flex:none;width:48px;text-align:center;border-radius:var(--r-sm);padding:5px 0 6px;
  background:color-mix(in srgb,var(--a) 16%,var(--card-bg));
}
.evc-date .m{display:block;font-size:11.5px;color:var(--muted)}
.evc-date .d{display:block;font-family:var(--serif);font-size:23px;line-height:1}
.evc-notes{font-size:13.5px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.evc-place{white-space:normal;overflow-wrap:anywhere}
.evc-tags{gap:6px}
.evc-count{margin-left:auto;font-size:12.5px;color:var(--muted)}
.evc-foot{display:flex;gap:4px;margin-top:auto;padding-top:var(--s1);border-top:1px solid var(--line-soft)}
.evgrid.past .evc{opacity:.72}
.post-nm{display:flex;flex-direction:column;gap:2px;white-space:normal}
.post-body{font-size:13px;color:var(--muted)}

/* ---------- task categories on the calendar ---------- */
.cat-rows{display:flex;flex-direction:column}
.cat-row{display:flex;align-items:center;gap:10px;padding:9px 18px;border-top:1px solid var(--line-soft)}
.cat-row:first-child{border-top:0}
.cat-row .nm-in{
  flex:1;min-width:0;border:1px solid transparent;background:transparent;
  border-radius:var(--r-sm);padding:5px 8px;font-weight:500;
}
.cat-row .nm-in:hover{border-color:var(--line)}
.cat-row .nm-in:focus{border-color:transparent;background:var(--card-bg)}
.cat-row .ct{font-size:13px;color:var(--muted);white-space:nowrap}
.mv{
  width:26px;height:26px;padding:0;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:6px;background:var(--card-bg);
  color:var(--muted);font-size:12px;line-height:1;
}
.mv:hover{color:var(--card-text);border-color:var(--muted)}
.mv[disabled]{opacity:.35;cursor:default}

/* ---------- orders ---------- */
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--s2);margin-bottom:var(--s3)}
.tbox{
  background:var(--card-bg);border:1px solid var(--line);border-radius:var(--r-md);
  padding:13px 16px;
}
.tbox .n{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1}
.tbox .l{font-size:13px;color:var(--muted);margin-top:4px}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:var(--s3);align-items:start}
.ocard{overflow:hidden}
.oc-h{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
.oc-ico{
  width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;
  overflow:hidden;font-size:20px;background:var(--tint);
}
.oc-ico img{width:100%;height:100%;object-fit:contain;padding:5px;background:var(--card-bg)}
.oc-h h3{font-size:15.5px}
.oc-h .sub{font-size:12.5px;color:var(--muted)}
.oc-h .acts{margin-left:auto;display:flex;align-items:center;gap:5px}
.o-items > .o-item{border-top:1px solid var(--line-soft)}
.o-items > .o-item:first-child{border-top:0}
.o-item{padding:10px 16px}
.o-item.gone .nm{color:var(--muted);text-decoration:line-through}
.o-line{display:flex;align-items:center;gap:9px}
.o-line .nm{flex:1;min-width:0;font-weight:500}
.o-line .btn{opacity:0;transition:opacity .12s ease}
.o-item:hover .o-line .btn,.o-line .btn:focus{opacity:1}
.o-sub{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px;padding-left:26px}
.o-meta{font-size:12.5px;color:var(--muted)}
.o-acts{margin-left:auto;display:flex;gap:4px}
.o-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;margin:0 4px}
.o-dot.in{background:var(--ok)}
.capture{background:var(--tint);border-color:var(--line)}
.capture .add-row{background:transparent;border-top:0;border-radius:var(--r-md)}
.add-row .oq{width:86px;flex:none}
.add-row .ow{width:132px;flex:none}
.add-row .os{width:auto;flex:none;max-width:190px}
.o-row{display:flex;align-items:center;gap:10px;padding:9px 18px;border-top:1px solid var(--line-soft)}
.cat-h + .o-row{border-top:0}
.o-row .nm{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.o-row.gone .nm{color:var(--muted);text-decoration:line-through}
.o-meta{font-size:12.5px;color:var(--muted)}
.o-note{
  font-size:12.5px;color:var(--muted);max-width:210px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.o-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;margin:0 5px}
.o-row.gone .o-dot{background:var(--ok)}

/* ---------- people ---------- */
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px}
.pcard{background:var(--card-bg);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;display:flex;gap:13px}
.pcard .avatar{width:54px;height:54px}
.pcard .nm{font-weight:600;font-size:15px}
.pcard .ro{font-size:13.5px;color:var(--muted)}
.pcard .em{font-size:13px;color:var(--muted);word-break:break-all;margin-top:3px}
.pcard .acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}

/* ---------- area page ---------- */
.area-hero{
  border-radius:var(--r-md);padding:20px 22px;margin-bottom:20px;
  background:color-mix(in srgb,var(--a) 26%,var(--card-bg));
  border:1px solid color-mix(in srgb,var(--a) 40%,var(--card-bg));
}
.area-hero h1{font-family:var(--serif);font-weight:400;font-size:33px;letter-spacing:-.02em;line-height:1.1}
.area-hero .hstack{margin-top:14px}
.area-hero .sub{color:color-mix(in srgb,var(--a) 45%,var(--card-text));font-size:14px;margin-top:4px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:var(--s4);align-items:start}
.rail-r{position:sticky;top:24px;display:flex;flex-direction:column;gap:14px}
.rail-r .card{background:color-mix(in srgb,var(--a) 9%,var(--card-bg));border-color:color-mix(in srgb,var(--a) 24%,var(--line))}
.rail-r h3{font-size:14px;margin-bottom:9px}
.mini{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid color-mix(in srgb,var(--a) 18%,var(--card-bg))}
.mini:first-of-type{border-top:0}
.mini .avatar{width:30px;height:30px}
.mini .nm{font-size:13.5px;font-weight:500;line-height:1.25}
.mini .ro{font-size:12.5px;color:var(--muted);line-height:1.25}

table.items{width:100%;border-collapse:collapse}
table.items th{
  text-align:left;font-size:12.5px;color:var(--muted);font-weight:500;
  padding:8px 10px;border-bottom:1px solid var(--line);
}
table.items td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.items tr:last-child td{border-bottom:0}
table.items .nm{font-weight:500}
table.items tr.done .nm{text-decoration:line-through;color:var(--muted);font-weight:400}
.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}
.icard{
  display:flex;flex-direction:column;gap:7px;
  border:1px solid var(--line);border-left:3px solid var(--a);border-radius:var(--r-sm);
  padding:12px 14px;background:var(--card-bg);
}
.icard .nm{font-weight:600;line-height:1.3}
.ic-top{display:flex;align-items:flex-start;gap:9px}
.ic-top .tick{margin-top:1px}
.ic-rep{font-size:12.5px;color:var(--muted)}
.ic-notes{font-size:13px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ic-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:2px}
.odd{background:var(--tint);border:0}
.odd li{display:flex;gap:9px;align-items:center;padding:5px 0;font-size:13.5px;color:var(--muted)}
.odd ul{list-style:none;margin:0;padding:0}
.odd li.done span{text-decoration:line-through;opacity:.7}
.odd li{gap:8px}
.odd li span{flex:1;min-width:0}
.odd .x{margin-left:auto;padding:2px 6px;line-height:1;font-size:15px}
.oddadd{display:flex;gap:6px;margin-top:var(--s2)}
.oddadd .in{min-width:0;font-size:13.5px;padding:6px 8px}
.rail-r .odd{background:var(--tint);border-color:var(--line)}
.donebox{background:color-mix(in srgb,var(--ok) 7%,var(--card-bg));border-color:color-mix(in srgb,var(--ok) 18%,var(--line))}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:20px;z-index:70}
.modal{
  background:var(--card-bg);color:var(--card-text);border-radius:var(--r-lg);
  width:min(560px,100%);max-height:88vh;overflow:auto;box-shadow:var(--shadow-pop);
}
.modal .mh{display:flex;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line-soft)}
.modal .mh h2{font-size:17px}
.modal .mb{padding:18px 20px}
.modal .mb > * + *{margin-top:var(--s2)}
.modal h3{font-size:14.5px;margin:0}
.steps{padding-left:20px;font-size:14px;line-height:1.65;margin:0}
.rep{border-top:1px solid var(--line-soft);padding-top:var(--s3)}
.rep-end{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.rep-end > .field:first-child{grid-column:1/-1}
.rep-note{padding:8px 11px;border-radius:var(--r-sm);background:var(--tint)}
.modal pre{background:var(--tint);padding:12px;border-radius:8px;font-size:12.5px;overflow:auto;margin:0}
.modal .mf{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-soft);background:var(--tint);border-radius:0 0 var(--r-lg) var(--r-lg)}
.modal .mf .left{margin-right:auto}

/* ---------- colour customizer ---------- */
.paint{
  position:fixed;right:22px;bottom:22px;z-index:60;
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:var(--card-bg);box-shadow:var(--shadow-pop);
  display:grid;place-items:center;color:var(--muted);
}
.paint:hover{color:var(--accent)}
.paint svg{width:20px;height:20px}
.paint-panel{
  position:fixed;right:22px;bottom:76px;z-index:61;width:min(336px,calc(100vw - 44px));
  max-height:min(640px,calc(100vh - 110px));overflow:auto;
  background:var(--card-bg);color:var(--card-text);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow-pop);
}
.paint-panel .ph{padding:15px 17px 11px;border-bottom:1px solid var(--line-soft)}
.paint-panel .ph h2{font-size:15.5px}
.paint-panel .ph p{font-size:13px;color:var(--muted);margin:3px 0 0}
.paint-panel .pb{padding:13px 17px}
.set > * + *{margin-top:var(--s3)}
.set h3{margin-bottom:0}
.set .field{margin-bottom:0}
.paint-panel h3{font-size:12.5px;color:var(--muted);font-weight:500;margin:14px 0 7px}
.paint-panel h3:first-child{margin-top:0}
.sw-row{display:flex;align-items:center;gap:9px;padding:4px 0}
.sw-row .lb{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:27px;height:27px;border-radius:7px;border:1px solid var(--line);padding:0;overflow:hidden;flex:none;cursor:pointer}
.sw input[type=color]{width:150%;height:150%;margin:-25%;border:0;padding:0;background:none;cursor:pointer;display:block}
.sw input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.sw input[type=color]::-webkit-color-swatch{border:0}
.hex{width:90px;padding:4px 7px;font-size:12.5px;border:1px solid var(--line);border-radius:6px;background:var(--card-bg);font-variant-numeric:tabular-nums}
.pals{display:flex;flex-wrap:wrap;gap:7px}
.pal{border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:var(--card-bg);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.pal:hover{border-color:var(--accent)}
.pal .strip{display:flex;gap:2px}
.pal .strip i{width:13px;height:13px;border-radius:3px;display:block}
.pal .nm{font-size:11.5px;color:var(--muted)}
.pal-wrap{position:relative;display:inline-flex}
.pal-wrap .pal-del{
  position:absolute;top:-6px;right:-6px;width:18px;height:18px;padding:0;
  border-radius:50%;background:var(--card-bg);border:1px solid var(--line);
  font-size:11px;line-height:1;display:grid;place-items:center;color:var(--muted);min-height:0;
}
.warnbox{
  margin-top:11px;padding:9px 11px;border-radius:var(--r-sm);font-size:12.5px;
  background:color-mix(in srgb,var(--warn) 12%,var(--card-bg));color:var(--warn);
}

/* ---------- confetti + toast ---------- */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.confetti i{position:absolute;width:7px;height:11px;border-radius:1.5px;will-change:transform,opacity}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:95;
  background:var(--sidebar);color:var(--sidebar-text);padding:10px 16px;
  border-radius:999px;font-size:13.5px;box-shadow:var(--shadow-pop);
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .two{grid-template-columns:1fr}
  .rail-r{position:static;flex-direction:row;flex-wrap:wrap}
  .rail-r > .card{flex:1 1 250px}
}
@media (max-width:860px){
  /* the screen is too small to push page content over, so the menu overlays
     it instead, like it did before */
  .rail{
    position:fixed;left:0;top:0;height:100vh;z-index:85;
    width:var(--rail);padding:22px 14px 16px;
    transform:translateX(-100%);transition:transform .22s ease;
    overflow-y:auto;overflow-x:hidden;
  }
  .shell.nav-open .rail{transform:translateX(0)}
  .nav-scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none}
  .shell.nav-open .nav-scrim{display:block}
  .main{padding:70px var(--s3) 90px}
  .page-h h1{font-size:25px}
  .due-pair{grid-template-columns:1fr}
  .wk{grid-template-columns:1fr}
  .hero .avatar{width:70px;height:70px}
  .wx{margin-left:0;width:100%}

<script>
"use strict";
/* =======================================================================
   Work — a single file. Data stays in this browser, and syncs to your
   account in the cloud so your other devices see the same information.
   ======================================================================= */
var BUILD = "v15";
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = p => p + Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

/* ---------- dates (all local, no timezone surprises) ---------- */
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseDay = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return iso(d); };
const startOfWeek = s => { const d = parseDay(s); d.setDate(d.getDate() - d.getDay()); return iso(d); };
const DOW  = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON  = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const fmtDate = (s, long) => { const d = parseDay(s); return DOW[d.getDay()].slice(0, long ? 99 : 3) + " " + d.getDate() + " " + MON[d.getMonth()].slice(0, long ? 99 : 3); };
const fmtTime = t => {
  if (!t) return "";
  const [h, m] = t.split(":").map(Number);
  const ap = h >= 12 ? "pm" : "am";
  return ((h % 12) || 12) + (m ? ":" + pad(m) : "") + ap;
};
function relWord(s) {
  const diff = Math.round((parseDay(s) - parseDay(todayISO())) / 864e5);
  if (diff === 0) return "Today";
  if (diff === 1) return "Tomorrow";
  if (diff === -1) return "Yesterday";
  if (diff < 0) return Math.abs(diff) + " days late";
  return fmtDate(s);
}
const dueClass = s => {
  const diff = Math.round((parseDay(s) - parseDay(todayISO())) / 864e5);
  return diff < 0 ? "late" : diff === 0 ? "today" : "";
};

/* ---------- the banner's crop/zoom/height stay on this device, never synced ---------- */
const COVER_LOCAL_KEY = "work-hub-cover-local";
function localCoverGet() {
  try { return JSON.parse(localStorage.getItem(COVER_LOCAL_KEY)) || {}; } catch (e) { return {}; }
}
function localCoverSet(patch) {
  const cur = localCoverGet();
  Object.assign(cur, patch);
  try { localStorage.setItem(COVER_LOCAL_KEY, JSON.stringify(cur)); } catch (e) {}
}

/* ---------- storage: artifact API, then localStorage, then memory ---------- */
const KEY = "work-single-file-v1";
const mem = {};
const Store = {
  async get(k) {
    if (window.storage) { try { const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; } catch (e) {} }
    try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch (e) {}
    return mem[k] ?? null;
  },
  async set(k, v) {
    const s = JSON.stringify(v);
    mem[k] = v;
    if (window.storage) { try { await window.storage.set(k, s); return true; } catch (e) {} }
    try { localStorage.setItem(k, s); return true; } catch (e) { toast("Storage is full. Export a backup and remove some uploads."); return false; }
  }
};

/* ---------- uploaded files live in IndexedDB, not localStorage ---------- */
const Blobs = {
  db: null,
  async open() {
    if (this.db) return this.db;
    return this.db = await new Promise((res, rej) => {
      const rq = indexedDB.open("work-files", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("f");
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    }).catch(() => null);
  },
  async put(key, blob) { const db = await this.open(); if (!db) return false;
    return new Promise(r => { const t = db.transaction("f", "readwrite"); t.objectStore("f").put(blob, key); t.oncomplete = () => r(true); t.onerror = () => r(false); }); },
  async get(key) { const db = await this.open(); if (!db) return null;
    return new Promise(r => { const rq = db.transaction("f", "readonly").objectStore("f").get(key); rq.onsuccess = () => r(rq.result || null); rq.onerror = () => r(null); }); },
  async del(key) { const db = await this.open(); if (!db) return;
    return new Promise(r => { const t = db.transaction("f", "readwrite"); t.objectStore("f").delete(key); t.oncomplete = () => r(); t.onerror = () => r(); }); },
  async all() { const db = await this.open(); if (!db) return {};
    return new Promise(r => { const out = {}; const st = db.transaction("f", "readonly").objectStore("f"); const rq = st.openCursor();
      rq.onsuccess = e => { const c = e.target.result; if (!c) return r(out); out[c.key] = c.value; c.continue(); }; rq.onerror = () => r(out); }); }
};
const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = () => r(null); fr.readAsDataURL(b); });
const dataURLToBlob = u => fetch(u).then(r => r.blob());

/* ---------- shrink images so uploads don't eat the storage ---------- */
function shrinkImage(file, max = 1400, quality = .82) {
  return new Promise(res => {
    if (!/^image\//.test(file.type) || /svg/.test(file.type)) return res(file);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      if (sc === 1 && file.size < 500e3) { URL.revokeObjectURL(url); return res(file); }
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); res(b || file); }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

function weekOfMonth(day) {
  const d = parseDay(day), dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  return { wd: d.getDay(), nth: Math.ceil(d.getDate() / 7), last: d.getDate() + 7 > dim };
}
function nthWeekday(y, m, wd, nth) {                    // nth 1-4, or -1 for the last one
  if (nth === -1) { const L = new Date(y, m + 1, 0); return iso(new Date(y, m, L.getDate() - ((L.getDay() - wd + 7) % 7))); }
  const date = 1 + ((wd - new Date(y, m, 1).getDay() + 7) % 7) + (nth - 1) * 7;
  return date > new Date(y, m + 1, 0).getDate() ? null : iso(new Date(y, m, date));
}
function ruleDay(i, n) {
  if (i.repeat === "weekly")  return addDays(i.due, n * 7);
  if (i.repeat === "monthly") return addMonths(i.due, n);
  if (i.repeat === "yearly")  return addMonths(i.due, n * 12);
  const a = parseDay(i.due), w = weekOfMonth(i.due), first = new Date(a.getFullYear(), a.getMonth() + n, 1);
  if (i.repeat === "monthly-nth")  return nthWeekday(first.getFullYear(), first.getMonth(), w.wd, w.nth);
  if (i.repeat === "monthly-last") return nthWeekday(first.getFullYear(), first.getMonth(), w.wd, -1);
  return null;
}

/* the choices depend on the date picked, so they are worked out from it */
function repeatOptions(day) {
  const d = parseDay(day), w = weekOfMonth(day), wd = DOW[w.wd];
  const o = [["", "Does not repeat"], ["weekly", "Every week on " + wd], ["monthly", "Every month on the " + ordinal(d.getDate())]];
  if (w.nth <= 4) o.push(["monthly-nth", "Every month on the " + ORD[w.nth - 1] + " " + wd]);
  if (w.last)     o.push(["monthly-last", "Every month on the last " + wd]);
  o.push(["yearly", "Every year on " + d.getDate() + " " + MON[d.getMonth()]]);
  return o;
}
function repeatLabel(i) {
  if (!i.repeat) return "";
  const hit = repeatOptions(i.due).find(o => o[0] === i.repeat);
  let t = hit ? hit[1] : "Repeats";
  if (i.endType === "date" && i.endDate) t += ", until " + fmtDate(i.endDate);
  if (i.endType === "count" && i.endCount) t += ", " + i.endCount + " times";
  return t;
}
const REPEAT_WORD = new Proxy({}, { get: () => "Repeats" });   // kept for anything older that still asks

function occurrences(i, from, to, includeDone) {
  if (!i.repeat) return (!i.done || includeDone) && i.due >= from && i.due <= to ? [{ key: i.due, day: i.due }] : [];
  const done = i.doneDates || [], ov = i.overrides || {};
  const lo = addDays(from, -62), hi = addDays(to, 62);   // a moved occurrence can arrive from a nearby month
  let n = 0;

      : Math.floor(((b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth()) / (i.repeat === "yearly" ? 12 : 1));
    n = Math.max(0, n - 1);
  }
  const cap = Number(i.endCount) || Infinity, out = [];
  for (let c = 0; c < 900; c++, n++) {
    if (i.endType === "count" && n >= cap) break;
    const key = ruleDay(i, n);
    if (key === null) continue;
    if (key > hi) break;
    if (i.endType === "date" && i.endDate && key > i.endDate) break;
    if (key < lo) continue;
    const o = ov[key] || {};
    if (o.skip) continue;
    const day = o.day || key;
    if (day < from || day > to) continue;
    if (!includeDone && done.includes(key)) continue;
    out.push({ key, day });
  }
  return out.sort((a, b) => a.day.localeCompare(b.day));
}
const repeatDays = (i, from, to, includeDone) => occurrences(i, from, to, includeDone).map(o => o.day);
const occView = (i, key) => Object.assign({}, i, (i.overrides || {})[key] || {});      // the series, with that one's own changes

function nextOcc(i) {
  if (!i.repeat) return { key: i.due, day: i.due };
  const t = todayISO(), all = occurrences(i, addDays(t, -60), addDays(t, 800));
  return all.find(o => o.day >= t) || all[all.length - 1] || { key: i.due, day: i.due };
}
const nextDue = i => nextOcc(i).day;
const occDone = (i, key) => i.repeat ? (i.doneDates || []).includes(key) : i.done;

/* every task instance between two dates, soonest first — what the counters and the to-do list run on */
function openOcc(from, to, allOverdue) {
  const out = [];
  state.items.forEach(i => {
    if (i.repeat) occurrences(i, from, to).forEach(o => out.push({ item: i, key: o.key, day: o.day, v: occView(i, o.key) }));
    else if (!i.done && i.due <= to && (allOverdue || i.due >= from)) out.push({ item: i, key: i.due, day: i.due, v: i });
  });
  return out.sort((a, b) => (a.day + (a.v.time || "99:99")).localeCompare(b.day + (b.v.time || "99:99")));
}

const areaById = id => state.areas.find(a => a.id === id);

}

  const [s, e] = weekWindow(offset);
  return openOcc(s, e);
}
function itemsOn(day) { return state.items.filter(i => i.due === day).sort(bySoon); }

function setDone(id, on, ev, key) {
  const it = state.items.find(i => i.id === id);
  if (!it) return;
  if (it.repeat) {
    const d = key || nextOcc(it).key;
    it.doneDates = (it.doneDates || []).filter(x => x !== d);
    if (on) it.doneDates.push(d);
  } else {
    it.done = on; it.completedAt = on ? todayISO() : null;
  }

  save(); render();
}

<script>
"use strict";
/* ---------- schedule: day / week / month ---------- */
let calMode = "week";
let calCursor = todayISO();
let listMonth = todayISO().slice(0, 7);

function segHTML() {
  return '<div class="seg" role="group" aria-label="View">' +
    ["day","week","month"].map(m =>
      '<button data-act="calmode" data-mode="' + m + '" aria-pressed="' + (calMode === m) + '">' +
      m[0].toUpperCase() + m.slice(1) + "</button>").join("") + "</div>";

function thingsOn(day) {
  const out = [];
  state.items.forEach(i => {
    occurrences(i, day, day, true).forEach(o => { const v = occView(i, o.key);
      out.push({ kind:"item", id:i.id, key:o.key, name:v.name, time:v.time, areaId:i.areaId, done: occDone(i, o.key), day, repeat: !!i.repeat });
    });

    .forEach(p => out.push({ kind:"post", id:p.id, name:postTitle(p), time:"", areaId:p.areaId,
